<div class="task-list">
   <div class="header">
      <h2>Mes tâches</h2>
      <button (click)="showForm() ? closeForm() : openCreateForm()">
         {{ showForm() ? 'Annuler' : '+ Nouvelle tâche' }}
      </button>
   </div>

   @if (showForm()) {
   <app-task-form [taskToEdit]="taskBeingEdited()" (taskCreated)="onTaskCreated($event)"
      (taskUpdated)="onTaskUpdated($event)" />
   }

   @if (tasks().length === 0) {
   <p>Aucune tâche pour le moment.</p>
   } @else {
   <ul>
      @for (task of tasks(); track task.id) {
      <li>
         <div class="task-content">
            <strong>{{ task.title }}</strong>
            <span class="status">{{ task.status }}</span>
            @if (task.description) {
            <p>{{ task.description }}</p>
            }
         </div>
         <div class="task-actions">
            <button (click)="openEditForm(task)">Modifier</button>
            <button (click)="deleteTask(task.id)" class="delete-btn">Supprimer</button>
         </div>
      </li>
      }
   </ul>
   }
</div>
